services:
  - type: web
    name: matchday-desk
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: TZ
        value: Africa/Harare
      - key: FOOTBALL_DATA_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: matchday-db
          property: connectionString
databases:
  - name: matchday-db
    plan: free
